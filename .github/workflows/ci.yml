name: CI

on:
  pull_request:
  push:
    branches: [production]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commitlint:
    name: Commit messages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Lint every commit of the pull request
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          npx --yes -p @commitlint/cli@21 -p @commitlint/config-conventional@21 \
            commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose

  phpcs:
    name: PHPCS
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - run: composer install --no-interaction --no-progress

      - run: composer lint

  syntax:
    name: PHP ${{ matrix.php }} syntax
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        php: ['7.4', '8.3']
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: php -l on every PHP file
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l

  phpunit:
    name: PHPUnit on PHP ${{ matrix.php }}
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        php: ['7.4', '8.3']
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: sodium
          tools: composer:v2
          coverage: none

      # The lock file is resolved on the newest PHP; update lets PHP 7.4
      # pick the PHPUnit 9 release it supports.
      - run: composer update --no-interaction --no-progress

      - run: composer test
